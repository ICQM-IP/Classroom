<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3C的小天地</title>
    <!-- 引入 SheetJS 函式庫 -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --bg-slate: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-slate); color: var(--text-main); min-height: 100vh; }

        /* Header & Nav */
        header {
            background: #ffffff; border-bottom: 1px solid #E2E8F0; padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
        }
        .logo { font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; gap: 0.5rem; }
        .sync-status { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #CBD5E1; }
        .sync-dot.active { background-color: var(--success); }

        nav { display: flex; gap: 0.5rem; background: #F1F5F9; padding: 0.25rem; border-radius: 0.5rem; }
        .nav-btn {
            padding: 0.5rem 1rem; border: none; background: transparent; border-radius: 0.375rem;
            font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
        }
        .nav-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Main Container */
        .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }

        /* Toolbar */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 1rem; border-radius: 0.75rem; border: 1px solid #E2E8F0;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
        }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
        .btn {
            padding: 0.5rem 1rem; border: 1px solid transparent; border-radius: 0.5rem;
            font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.15s;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: white; border-color: #CBD5E1; color: var(--text-main); }
        .btn-outline:hover { background: #F8FAFC; }
        .btn-danger-link { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 0.85rem; text-decoration: underline; }

        /* Student Grid */
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; }
        .student-card {
            background: white; border-radius: 0.75rem; padding: 1rem; text-align: center;
            border: 2px solid #E2E8F0; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .student-card:hover { border-color: #A5B4FC; transform: translateY(-2px); }
        .student-card.selected { border-color: var(--primary); background-color: #EEF2FF; }
        
        .card-checkbox { position: absolute; top: 0.75rem; left: 0.75rem; width: 18px; height: 18px; cursor: pointer; }
        .avatar { font-size: 2.8rem; margin-bottom: 0.25rem; }
        .name { font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; }
        
        .pts-container { display: flex; justify-content: center; gap: 0.3rem; margin-bottom: 0.75rem; font-size: 0.8rem; font-weight: 700; }
        .pt-badge { padding: 0.2rem 0.5rem; border-radius: 1rem; }
        .curr-pt { background: #E0E7FF; color: var(--primary); }

        .quick-btns { display: flex; gap: 0.25rem; justify-content: center; }
        .quick-btn { border: none; padding: 0.25rem 0.6rem; border-radius: 0.375rem; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .q-add { background: #D1FAE5; color: #047857; }
        .q-sub { background: #FEE2E2; color: #B91C1C; }

        /* Store & Roster & Behavior Management */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
        .store-card { background: white; border-radius: 0.75rem; padding: 1.25rem; border: 1px solid #E2E8F0; text-align: center; position: relative; }
        
        .roster-card { background: white; border: 1px solid #E2E8F0; border-radius: 0.5rem; padding: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
        .roster-info { display: flex; align-items: center; gap: 1rem; flex-grow: 1; flex-wrap: wrap; }

        .del-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #94A3B8; cursor: pointer; font-size: 14px; }
        .del-btn:hover { color: var(--danger); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 1.5rem; border-radius: 1rem; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        
        .behavior-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
        .behavior-item {
            display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.8rem;
            border: 1px solid #E2E8F0; border-radius: 0.5rem; background: white; cursor: pointer; font-weight: 600;
        }
        .behavior-item:hover { border-color: var(--primary); background: #F8FAFC; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 0.5rem; overflow: hidden; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #F8FAFC; color: var(--text-muted); font-size: 0.85rem; }

        input[type="text"], input[type="number"], select { padding: 0.5rem 0.75rem; border: 1px solid #CBD5E1; border-radius: 0.375rem; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }

        /* Float Anim */
        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
        .anim-tag { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 1.2rem; pointer-events: none; animation: popUp 0.7s forwards; }

        /* Compact classroom: seven columns, five rows; seating never writes score data. */
        header { flex-wrap: wrap; gap: .5rem; padding: .6rem 1rem; }
        nav { flex-wrap: wrap; }
        .container { max-width: 1600px; margin: .6rem auto; }
        #tab-tracker .toolbar { padding: .5rem .75rem; margin-bottom: .5rem; }
        .classroom-heading { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.5rem; flex-wrap:wrap; }
        .classroom-heading h1 { font-size:1.15rem; }
        .seat-help { font-size:.8rem; color:var(--text-muted); }
        .classroom { background:#edf2f7; padding:.6rem; border:1px solid #dce3ed; border-radius:1rem; overflow-x:auto; }
        .student-grid { grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:repeat(5,minmax(82px,1fr)); gap:clamp(5px, .8vh, 10px); height:calc(100dvh - 280px); min-height:400px; min-width:700px; }
        .seat { position:relative; min-width:0; border-radius:.65rem; }
        .seat.empty { border:1px dashed #bdc9d9; display:flex; align-items:center; justify-content:center; color:#8190a5; font-size:.8rem; }
        .seat.drop-target { outline:3px solid var(--primary); outline-offset:1px; }
        .student-card { height:100%; padding:4px 6px; display:grid; grid-template-columns:30px 1fr; grid-template-rows:1fr 1fr 28px; align-items:center; column-gap:4px; border-radius:.65rem; }
        .student-card:hover { transform:none; }
        .student-card .avatar { font-size:1.5rem; margin:0; grid-row:1 / 3; }
        .student-card .name { margin:0 20px 0 0; font-size:clamp(12px,1.1vw,16px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
        .student-card .pts-container { margin:0; justify-content:flex-start; }
        .student-card .curr-pt { font-size:clamp(14px,1.35vw,20px)!important; padding:0 8px!important; }
        .student-card .card-checkbox { top:6px; right:6px; left:auto; width:15px; height:15px; }
        .student-card .quick-btns { grid-column:1 / 3; justify-content:stretch; }
        .student-card .quick-btn { flex:1; padding:3px; }
        .seat-number { position:absolute; left:5px; top:3px; font-size:9px; color:#94a3b8; pointer-events:none; }
        .arranging .student-card { cursor:grab; border-style:dashed; }
        .arranging .student-card:active { cursor:grabbing; }
        .arranging .student-card.picked { outline:3px solid #f59e0b; }
        .arranging .quick-btns, .arranging .card-checkbox { visibility:hidden; }
        .student-card:focus-visible, .seat:focus-visible { outline:3px solid #f59e0b; }
        .classroom-footer { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:.5rem; min-width:700px; }
        .teacher-desk { display:flex; align-items:center; gap:.65rem; background:#fff5df; border:1px solid #e9cf92; border-bottom:4px solid #d9b96f; border-radius:.6rem; padding:.45rem .7rem; }
        .teacher-desk label { display:flex; align-items:center; gap:.3rem; }
        .teacher-desk input { width:90px; padding:.25rem; background:white; }
        #seat-overflow { display:grid; grid-template-columns:repeat(7,minmax(100px,1fr)); gap:.5rem; }
        #seat-overflow:not(:empty) { margin-top:.7rem; }
        #seat-overflow .seat { height:100px; }
        @media (max-width:800px) { header { position:static; } .classroom-heading { align-items:flex-start; } .student-grid { height:500px; } .container { padding:0 .5rem; } }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="logo">👦3C的小天地👧</div>
            <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">雲端未同步</span></div>
            <button id="cloud-test-btn" class="nav-btn" onclick="testCloudSync()" title="測試 Google Sheet A1 是否可以寫入及讀回">測試雲端同步</button>
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('tracker')">加扣分專區</button>
            <button class="nav-btn" onclick="switchTab('roster')">學生名冊管理</button>
            <button class="nav-btn" onclick="switchTab('behaviors')">加扣分項目管理</button>
            <button class="nav-btn" onclick="switchTab('store')">獎勵商城管理</button>
            <button class="nav-btn" onclick="switchTab('logs')">歷史紀錄</button>
        </nav>
    </header>

    <div class="container">
        <!-- 頁籤 1: 加扣分專區 -->
        <div id="tab-tracker">
            <div class="toolbar">
                <div class="btn-group">
                    <button class="btn btn-outline" onclick="toggleSelectAll()">全選 / 取消</button>
                    <button class="btn btn-primary" onclick="openBatchModal()">多選加扣分 (<span id="select-cnt">0</span>)</button>
                    <button class="btn btn-success" onclick="quickAll(+1)">全班 +1 分</button>
                </div>
                <div class="btn-group">
                    <label class="btn btn-outline">
                        📂 匯入 Excel 名冊
                        <input type="file" id="import-excel" accept=".xlsx, .xls" style="display:none;" onchange="importExcel(event)">
                    </label>
                    <button class="btn btn-outline" onclick="exportStudentsExcel()">📥 匯出名冊 Excel</button>
                </div>
            </div>
            <div class="classroom-heading">
                <div><h1>班級座位表 <span class="seat-help">7 欄 × 5 排</span></h1><p class="seat-help" id="seat-status" role="status">點選學生計分；按「調整座位」拖曳換位。</p></div>
                <button class="btn btn-outline" id="seat-edit" onclick="toggleSeatEdit()" aria-pressed="false">調整座位</button>
            </div>
            <div class="classroom">
                <div class="student-grid" id="student-grid" aria-label="7 欄 5 排學生座位表"></div>
                <div class="classroom-footer">
                    <span class="seat-help">座位及老師姓名儲存在此瀏覽器</span>
                    <div class="teacher-desk" aria-label="兩人老師桌"><strong>老師桌</strong>
                        <label>🧑‍🏫 <input id="teacher-0" aria-label="第一位老師姓名" placeholder="老師 1" maxlength="20" onchange="saveTeacherNames()"></label>
                        <label>🧑‍🏫 <input id="teacher-1" aria-label="第二位老師姓名" placeholder="老師 2" maxlength="20" onchange="saveTeacherNames()"></label>
                    </div>
                </div>
            </div>
            <p id="overflow-label" class="seat-help" hidden>待安排學生（35 個座位已滿，可拖曳至座位交換）</p>
            <div id="seat-overflow"></div>
        </div>

        <!-- 頁籤 2: 學生名冊管理 -->
        <div id="tab-roster" style="display: none;">
            <div class="toolbar">
                <div style="display: flex; gap: 0.5rem; align-items: center; width: 100%; flex-wrap: wrap;">
                    <select id="new-avatar" style="font-size: 1.1rem; max-width: 200px;">
                        <optgroup label="🧑 人物角色">
                            <option value="👦">👦 男生</option>
                            <option value="👧">👧 女生</option>
                            <option value="👨‍🎓">👨‍🎓 男學生</option>
                            <option value="👩‍🎓">👩‍🎓 女學生</option>
                            <option value="🦸‍♂️">🦸‍♂️ 英雄</option>
                        </optgroup>
                        <optgroup label="🐾 豐富動物">
                            <option value="🐶">🐶 小狗</option>
                            <option value="🐱">🐱 貓咪</option>
                            <option value="🐰">🐰 兔子</option>
                            <option value="🦊">🦊 狐狸</option>
                            <option value="🐻">🐻 熊熊</option>
                            <option value="🐼">🐼 貓熊</option>
                            <option value="🐨">🐨 無尾熊</option>
                            <option value="🐯">🐯 老虎</option>
                            <option value="🦁">🦁 獅子</option>
                            <option value="🐮">🐮 小牛</option>
                            <option value="🐷">🐷 小豬</option>
                            <option value="🐸">🐸 青蛙</option>
                            <option value="🐵">🐵 猴子</option>
                            <option value="🐧">🐧 企鵝</option>
                            <option value="🦄">🦄 獨角獸</option>
                            <option value="🐬">🐬 海豚</option>
                            <option value="🦈">🦈 鯊魚</option>
                            <option value="🦉">🦉 貓頭鷹</option>
                            <option value="🐢">🐢 烏龜</option>
                            <option value="🦖">🦖 恐龍</option>
                            <option value="🐘">🐘 大象</option>
                            <option value="🦒">🦒 長頸鹿</option>
                            <option value="🐝">🐝 蜜蜂</option>
                            <option value="🦋">🦋 蝴蝶</option>
                        </optgroup>
                        <optgroup label="⚽ 體育運動">
                            <option value="⚽">⚽ 足球</option>
                            <option value="🏀">🏀 籃球</option>
                            <option value="🏈">🏈 美式足球</option>
                            <option value="⚾">⚾ 棒球</option>
                            <option value="🎾">🎾 網球</option>
                            <option value="🏐">🏐 排球</option>
                            <option value="🏓">🏓 桌球</option>
                            <option value="🏸">🏸 羽球</option>
                            <option value="⛳">⛳ 高爾夫</option>
                            <option value="🎯">🎯 射箭/飛鏢</option>
                            <option value="🥊">🥊 拳擊</option>
                            <option value="🥋">🥋 空手道</option>
                            <option value="🛹">🛹 滑板</option>
                            <option value="🏊">🏊 游泳</option>
                            <option value="🚴">🚴 騎車</option>
                        </optgroup>
                        <optgroup label="🎸 音樂樂器">
                            <option value="🎸">🎸 吉他</option>
                            <option value="🎹">🎹 鋼琴/鍵盤</option>
                            <option value="🎷">🎷 薩克斯風</option>
                            <option value="🎺">🎺 小號</option>
                            <option value="🎻">🎻 小提琴</option>
                            <option value="🥁">🥁 爵士鼓</option>
                            <option value="🪕">🪕 斑鳩琴</option>
                            <option value="🎙️">🎙️ 麥克風</option>
                            <option value="🎧">🎧 耳機</option>
                            <option value="🎶">🎶 音符</option>
                        </optgroup>
                        <optgroup label="🚀 探索與載具">
                            <option value="🚀">🚀 火箭</option>
                            <option value="🌟">🌟 星星</option>
                            <option value="🎨">🎨 調色盤</option>
                            <option value="🏎️">🏎️ 賽車</option>
                        </optgroup>
                    </select>
                    <input type="text" id="new-name" placeholder="輸入學生姓名" style="flex-grow: 1;">
                    <button class="btn btn-primary" onclick="addStudent()">➕ 新增學生</button>
                </div>
            </div>

            <div id="roster-list"></div>
        </div>

        <!-- 頁籤 3: 加扣分項目管理 -->
        <div id="tab-behaviors" style="display: none;">
            <div class="toolbar">
                <div style="display: flex; gap: 0.5rem; align-items: center; width: 100%; flex-wrap: wrap;">
                    <select id="new-behavior-icon" style="font-size: 1.2rem;">
                        <option value="🙋‍♂️">🙋‍♂️ 踴躍發言</option>
                        <option value="🤝">🤝 熱心助人</option>
                        <option value="⭐">⭐ 團隊合作</option>
                        <option value="📝">📝 作業優異</option>
                        <option value="👏">👏 良好表現</option>
                        <option value="🎯">🎯 專注聽講</option>
                        <option value="🤫">🤫 課堂吵鬧</option>
                        <option value="📚">📚 未帶課本</option>
                        <option value="⚠️">⚠️ 違規警告</option>
                        <option value="🚶">🚶 遲到</option>
                        <option value="🗣️">🗣️ 私下講話</option>
                        <option value="😴">😴 上課打瞌睡</option>
                    </select>
                    <select id="new-behavior-type" style="font-size: 0.9rem;">
                        <option value="pos">正面加分 (+)</option>
                        <option value="neg">待改進扣分 (-)</option>
                    </select>
                    <input type="text" id="new-behavior-title" placeholder="項目名稱 (如: 準時繳交作業)" style="flex-grow: 1;">
                    <input type="number" id="new-behavior-pts" placeholder="分數 (如 1 或 2)" style="width: 100px;" value="1">
                    <button class="btn btn-primary" onclick="addBehaviorItem()">➕ 新增加扣分項目</button>
                </div>
            </div>

            <div class="store-grid" id="behavior-grid"></div>
        </div>

        <!-- 頁籤 4: 獎勵商城 -->
        <div id="tab-store" style="display: none;">
            <div class="toolbar">
                <div style="display: flex; gap: 0.5rem; align-items: center; width: 100%; flex-wrap: wrap;">
                    <select id="new-reward-icon" style="font-size: 1.2rem;">
                        <option value="🪑">🪑 換座位</option>
                        <option value="🎟️">🎟️ 免作業</option>
                        <option value="👑">👑 當組長</option>
                        <option value="🎵">🎵 背景音樂</option>
                        <option value="🎁">🎁 禮物</option>
                        <option value="🍔">🍔 美食點心</option>
                        <option value="🍦">🍦 冰淇淋</option>
                        <option value="🎮">🎮 遊戲時間</option>
                        <option value="✏️">✏️ 文具獎勵</option>
                        <option value="🏆">🏆 榮譽卡</option>
                    </select>
                    <input type="text" id="new-reward-title" placeholder="獎勵品項名稱" style="flex-grow: 1;">
                    <input type="number" id="new-reward-cost" placeholder="所需點數" style="width: 100px;">
                    <button class="btn btn-primary" onclick="addReward()">➕ 新增獎勵品項</button>
                    
                    <div style="margin-left: auto; display: flex; gap: 0.5rem;">
                        <label class="btn btn-outline">
                            📂 匯入獎勵 Excel
                            <input type="file" id="import-reward-excel" accept=".xlsx, .xls" style="display:none;" onchange="importRewardsExcel(event)">
                        </label>
                        <button class="btn btn-outline" onclick="exportRewardsExcel()">📥 匯出獎勵 Excel</button>
                    </div>
                </div>
            </div>

            <div class="store-grid" id="store-grid"></div>
        </div>

        <!-- 頁籤 5: 歷史紀錄 -->
        <div id="tab-logs" style="display: none;">
            <div class="toolbar">
                <h3 style="font-size: 1.1rem;">📜 點數變動明細</h3>
                <div class="btn-group">

    <script>
        // Google Apps Script URL 雲端連結
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzVImxD0zWoI0xUbujCXoUuqPkVuOKroLtBztQi1hZ3zKwffAfFnp0_q-Lt7OMmd_Obwg/exec";

        const AVATAR_GROUPS = [

        const DEFAULT_STUDENTS = [

        const DEFAULT_REWARDS = [

        let students = JSON.parse(localStorage.getItem('v5_students')) || DEFAULT_STUDENTS;
        let rewards = JSON.parse(localStorage.getItem('v5_rewards')) || DEFAULT_REWARDS;
        let behaviors = JSON.parse(localStorage.getItem('v5_behaviors')) || DEFAULT_BEHAVIORS;
        let logs = JSON.parse(localStorage.getItem('v5_logs')) || [];
        let selectedStudentIds = new Set();
        let targetStudentId = null;
        let currentRewardForRedeem = null;

        /* 雲端資料同步機制 */
        let saveQueue = Promise.resolve();
        let cloudSyncVersion = 0;

        function setSyncStatus(isSynced, text) {
            const dot = document.getElementById('sync-dot');
            const label = document.getElementById('sync-text');
            if (isSynced) {
                dot.classList.add('active');
                label.innerText = text || "已成功同步至雲端試算表";
            } else {
                dot.classList.remove('active');
                label.innerText = text || "正在同步雲端...";
            }
        }

        async function loadDataFromCloud() {
            if (!GAS_URL) return;
            setSyncStatus(false, "與雲端同步中...");

            try {
                // 加時間戳 + no-store，避免重新整理時讀到舊的 GET cache
                const url = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
                const res = await fetch(url, {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!res.ok) throw new Error('雲端讀取 HTTP ' + res.status);

                const text = await res.text();
                if (!text || text.trim() === '' || text.trim() === '{}') {
                    setSyncStatus(true, '雲端目前沒有資料');
                    return;
                }

                const data = JSON.parse(text);
                if (data.status === 'error') throw new Error(data.message || 'Apps Script 讀取失敗');

                if (Array.isArray(data.students) && data.students.length > 0) students = data.students;
                if (Array.isArray(data.rewards) && data.rewards.length > 0) rewards = data.rewards;
                if (Array.isArray(data.behaviors) && data.behaviors.length > 0) behaviors = data.behaviors;
                if (Array.isArray(data.logs)) logs = data.logs;

                localStorage.setItem('v5_students', JSON.stringify(students));
                localStorage.setItem('v5_rewards', JSON.stringify(rewards));
                localStorage.setItem('v5_behaviors', JSON.stringify(behaviors));
                localStorage.setItem('v5_logs', JSON.stringify(logs));

                renderAll();
                setSyncStatus(true, '已載入雲端最新資料');
            } catch (e) {
                console.error('雲端載入失敗，使用本機紀錄', e);
                setSyncStatus(false, '離線模式（使用本機紀錄）');
            }
        }

        function saveData() {
            // 先即時保存到本機，避免網絡中斷時資料消失
            localStorage.setItem('v5_students', JSON.stringify(students));
            localStorage.setItem('v5_rewards', JSON.stringify(rewards));
            localStorage.setItem('v5_behaviors', JSON.stringify(behaviors));
            localStorage.setItem('v5_logs', JSON.stringify(logs));

            if (!GAS_URL) return Promise.resolve(false);

            // 將快速連續操作排隊，避免多個 POST 同時寫入 A1 而互相覆蓋
            const payload = JSON.stringify({ students, rewards, behaviors, logs });
            const version = ++cloudSyncVersion;

            saveQueue = saveQueue
                .catch(() => false)
                .then(() => sendDataToCloud(payload, version));

            return saveQueue;
        }

        async function sendDataToCloud(payload, version) {
            setSyncStatus(false, '同步中...');

            try {
                // GitHub Pages 與 Apps Script 屬跨來源請求；使用 no-cors 避免 CORS 預檢問題。
                // await 會等到瀏覽器完成這次網絡請求，避免立即重新整理造成舊資料覆蓋。
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payload
                });

                if (version === cloudSyncVersion) {
                    setSyncStatus(true, '已成功送出雲端儲存');
                }
                return true;
            } catch (err) {
                console.error('同步失敗:', err);
                if (version === cloudSyncVersion) {
                    setSyncStatus(false, '同步失敗（已保留本機紀錄）');
                }
                return false;
            }
        }

        async function waitForCloudSave() {
            try { return await saveQueue; } catch (_) { return false; }
        }

        /*
         * 雲端寫入診斷（配合新版分欄儲存架構）：
         * 1. POST 一筆只帶測試標記的資料，後端會寫進專屬的測試欄位（F2），完全不會碰到
         *    students / rewards / behaviors / logs 這些正式資料，所以不需要再讀取、還原 A1。
         * 2. GET 讀回，確認測試欄位裡的標記跟剛剛送出的一致。
         * 注意：POST 使用 no-cors，所以不能直接讀 POST 回應；真正的成功判斷以之後 GET 到的結果為準。
         */
        async function testCloudSync() {
            const btn = document.getElementById('cloud-test-btn');
            if (!GAS_URL) {
                alert('尚未設定 Google Apps Script URL。');
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = '測試中...';
            }
            setSyncStatus(false, '正在測試雲端寫入...');

            const makeGetUrl = () => GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + 'test=' + Date.now() + '_' + Math.random().toString(36).slice(2);
            const marker = 'TEST_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);

            async function postMarker() {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ __cloudSyncTest: marker })
                });
            }

            async function getTestField() {
                const res = await fetch(makeGetUrl(), { method: 'GET', cache: 'no-store' });
                if (!res.ok) throw new Error('GET HTTP ' + res.status);
                const text = await res.text();
                const data = JSON.parse(text);
                if (data && data.status === 'error') throw new Error(data.message || 'Apps Script 回傳錯誤');
                return data.test;
            }

            try {
                await postMarker();

                let ok = false;
                for (let i = 0; i < 6; i++) {
                    await new Promise(resolve => setTimeout(resolve, i === 0 ? 700 : 1000));
                    const testField = await getTestField();
                    if (testField && testField.__cloudSyncTest === marker) { ok = true; break; }
                }

                if (!ok) throw new Error('POST 後重新讀取，未找到測試標記。');

                setSyncStatus(true, '雲端寫入測試成功');
                alert('🟢 雲端同步測試成功！\n\n已確認：網頁 → GAS POST → Google Sheet → GET 讀回，整條流程正常。\n（本測試只會寫入專屬的測試欄位，不會影響任何正式資料。）');
            } catch (err) {
                console.error('雲端同步測試失敗:', err);
                setSyncStatus(false, '雲端寫入測試失敗');
                alert('🔴 雲端同步測試失敗。\n\n原因：' + (err && err.message ? err.message : err) + '\n\n請到 Apps Script 編輯器查看「執行項目 Executions」紀錄找出實際錯誤。');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = '測試雲端同步';
                }
            }
        }

        async function resetAllData() {
            if (confirm('確定要將所有學生、加扣分項目與獎勵清單重置回預設值嗎？')) {
                localStorage.removeItem('v5_students');
                localStorage.removeItem('v5_rewards');
                localStorage.removeItem('v5_behaviors');
                localStorage.removeItem('v5_logs');
                students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
                rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
                behaviors = JSON.parse(JSON.stringify(DEFAULT_BEHAVIORS));
                logs = [];
                selectedStudentIds.clear();
                renderAll();
                await saveData();
            }
        }

        /* 音效處理 */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(isPositive) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isPositive) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        /* 歷史紀錄與動畫輔助 */
        function addLog(studentName, reason, delta) {
            const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
            logs.unshift({
                time: timeStr,
                student: studentName,
                reason: reason,
                delta: delta > 0 ? `+${delta}` : `${delta}`
            });
            if (logs.length > 200) logs.pop();
        }

        function showAnim(card, text, isPositive) {
            if (!card) return;
            const tag = document.createElement('div');
            tag.className = 'anim-tag';
            tag.innerText = text;
            tag.style.color = isPositive ? 'var(--success)' : 'var(--danger)';
            card.appendChild(tag);
            setTimeout(() => tag.remove(), 700);
        }

        /* Excel - 學生名冊匯入/匯出 */
        async function importExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if (json.length === 0) return alert('Excel 檔內無資料！');

                    students = json.map((item, idx) => ({
                        id: item['學號'] || item['ID'] || (idx + 1),
                        name: item['學生姓名'] || item['姓名'] || `學生${idx + 1}`,
                        avatar: item['學生 Icon'] || item['頭像'] || '👦',
                        currentPoints: Number(item['目前點數'] ?? 10),
                        lifetimePoints: Number(item['總點數'] ?? 20)
                    }));
                    await saveData(); renderAll();
                    alert(`成功從 Excel 匯入 ${students.length} 位學生名單！`);
                } catch (err) { alert('匯入失敗，請確認格式！'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportStudentsExcel() {
            const exportData = students.map(s => ({
                "學號": s.id, "學生姓名": s.name, "學生 Icon": s.avatar, "目前點數": s.currentPoints, "總點數": s.lifetimePoints
            }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "學生名冊");
            XLSX.writeFile(workbook, `班級學生名冊_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        /* Excel - 獎勵商城匯入/匯出 */
        async function importRewardsExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {

                } catch (err) { alert('匯入失敗，請確認格式！'); }

        function exportRewardsExcel() {
            const exportData = rewards.map(r => ({
                "品項名稱": r.title, "圖示 Icon": r.icon, "所需點數": r.cost
            }));

        /* 頁籤切換 */
        function switchTab(tabId) {
            ['tracker', 'roster', 'behaviors', 'store', 'logs'].forEach(id => {
                const el = document.getElementById('tab-' + id);
                if (el) el.style.display = (id === tabId) ? 'block' : 'none';
            });
            
            const btns = document.querySelectorAll('nav .nav-btn');
            const tabs = ['tracker', 'roster', 'behaviors', 'store', 'logs'];
            btns.forEach((btn, idx) => {
                if (tabs[idx] === tabId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            renderAll();
        }

        // Separate UI-only storage: never call saveData or mutate students here.
        const SEATING_KEY = 'classroom_seating_v1';
        const TEACHERS_KEY = 'classroom_teachers_v1';
        function readLayout(key) {
            try { const value = JSON.parse(localStorage.getItem(key)); return Array.isArray(value) ? value : []; }
            catch (_) { return []; }
        }
        let seatIds = readLayout(SEATING_KEY);
        let seatEditing = false;
        let pickedStudentId = null;
        let draggingStudentId = null;
        function reconcileSeats() {
            const valid = new Set(students.map(s => String(s.id)));
            const used = new Set();
            seatIds = Array.from({length:35}, (_, i) => {
                const id = seatIds[i] == null ? null : String(seatIds[i]);
                if (!valid.has(id) || used.has(id)) return null;
                used.add(id); return id;
            });
            students.forEach(s => {
                const id = String(s.id), empty = seatIds.indexOf(null);
                if (!used.has(id) && empty !== -1) { seatIds[empty] = id; used.add(id); }
            });
        }
        function saveLayout(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; }
            catch (_) { document.getElementById('seat-status').textContent = '瀏覽器未能儲存位置，重新整理後可能遺失本次安排。'; return false; }
        }
        function saveTeacherNames() {
            saveLayout(TEACHERS_KEY, [0,1].map(i => document.getElementById('teacher-'+i).value));
        }
        function toggleSeatEdit() {
            seatEditing = !seatEditing; pickedStudentId = null; draggingStudentId = null;
            document.getElementById('seat-edit').textContent = seatEditing ? '完成座位安排' : '調整座位';
            document.getElementById('seat-edit').setAttribute('aria-pressed', String(seatEditing));
            document.getElementById('seat-status').textContent = seatEditing ? '拖曳學生換位；也可先點學生，再點目的座位。位置自動儲存，分數保持不變。' : '點選學生計分；按「調整座位」拖曳換位。';
            renderStudents();
        }
        function moveToSeat(id, target) {
            if (!seatEditing || id == null || !students.some(s => String(s.id) === id)) return;
            reconcileSeats();
            const from = seatIds.indexOf(id);
            if (!Number.isInteger(target) || target < 0 || target >= 35) return;
            const displaced = seatIds[target];
            seatIds[target] = id;
            if (from !== -1) seatIds[from] = displaced;
            pickedStudentId = null; draggingStudentId = null;
            saveLayout(SEATING_KEY, seatIds);
            renderStudents();
        }
        function renderStudents() {
            reconcileSeats();
            const grid = document.getElementById('student-grid');
            const overflow = document.getElementById('seat-overflow');
            grid.replaceChildren(); overflow.replaceChildren();
            grid.classList.toggle('arranging', seatEditing);
            overflow.classList.toggle('arranging', seatEditing);
            function makeSeat(s, index) {
                const seat = document.createElement('div');
                seat.className = 'seat' + (s ? '' : ' empty');
                const label = index == null ? '待安排' : `${Math.floor(index/7)+1} 排 ${index%7+1} 號`;
                seat.setAttribute('aria-label', label);
                if (seatEditing) {
                    seat.tabIndex = 0;
                    seat.setAttribute('role', 'button');
                    seat.setAttribute('aria-label', label + (s ? ' '+s.name : ' 空位'));
                }
                const activate = () => {
                    if (!seatEditing) return;
                    if (pickedStudentId !== null && index != null) moveToSeat(pickedStudentId, index);
                    else if (s) { pickedStudentId = String(s.id); renderStudents(); document.getElementById('seat-status').textContent = `已選取 ${s.name}，請點選目的座位。`; }
                };
                seat.onclick = activate;
                seat.onkeydown = e => { if (seatEditing && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); activate(); } if (e.key === 'Escape') { pickedStudentId = null; renderStudents(); } };
                seat.ondragover = e => { if (seatEditing && draggingStudentId !== null && index != null) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; seat.classList.add('drop-target'); } };
                seat.ondragleave = () => seat.classList.remove('drop-target');
                seat.ondrop = e => { e.preventDefault(); seat.classList.remove('drop-target'); if (index != null) moveToSeat(draggingStudentId, index); };
                if (!s) { seat.textContent = label + ' · 空位'; return seat; }
                const card = document.createElement('div');
                card.className = 'student-card' + (selectedStudentIds.has(s.id) ? ' selected' : '') + (pickedStudentId === String(s.id) ? ' picked' : '');
                card.id = `card-${s.id}`;
                card.draggable = seatEditing;
                card.ondragstart = e => { if (!seatEditing) { e.preventDefault(); return; } draggingStudentId = String(s.id); e.dataTransfer.setData('text/plain', String(s.id)); e.dataTransfer.effectAllowed = 'move'; };
                card.ondragend = () => { draggingStudentId = null; document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target')); };
                // Pointer dragging also supports touch screens and trackpads.
                card.style.touchAction = seatEditing ? 'none' : 'auto';
                card.onpointerdown = e => {
                    if (!seatEditing || e.button !== 0) return;
                    const x = e.clientX, y = e.clientY;
                    let moved = false;
                    card.setPointerCapture(e.pointerId);
                    card.onpointermove = ev => {
                        if (Math.hypot(ev.clientX-x, ev.clientY-y) > 6) moved = true;
                        if (!moved) return;
                        document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
                        const target = document.elementFromPoint(ev.clientX,ev.clientY)?.closest('#student-grid > .seat');
                        if (target) target.classList.add('drop-target');
                    };
                    card.onpointerup = ev => {
                        card.onpointermove = null; card.onpointerup = null;
                        document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
                        if (!moved) return;
                        const target = document.elementFromPoint(ev.clientX,ev.clientY)?.closest('#student-grid > .seat');
                        ev.preventDefault(); ev.stopPropagation();
                        if (target) moveToSeat(String(s.id), Array.from(grid.children).indexOf(target));
                    };
                    card.onpointercancel = () => { card.onpointermove = null; card.onpointerup = null; document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target')); };
                };
                card.draggable = false;
                card.onclick = e => { if (!seatEditing && !e.target.closest('input,button')) openSingleModal(s.id); };
                const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.className = 'card-checkbox'; checkbox.checked = selectedStudentIds.has(s.id); checkbox.disabled = seatEditing;
                checkbox.setAttribute('aria-label', '選取 '+s.name); checkbox.onchange = e => toggleSelect(s.id,e);
                const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = s.avatar;
                const name = document.createElement('div'); name.className = 'name'; name.textContent = s.name; name.title = s.name;
                const points = document.createElement('div'); points.className = 'pts-container';
                const badge = document.createElement('span'); badge.className = 'pt-badge curr-pt'; badge.textContent = s.currentPoints+' pts'; points.append(badge);
                const buttons = document.createElement('div'); buttons.className = 'quick-btns';
                [1,-1].forEach(delta => { const btn = document.createElement('button'); btn.className = 'quick-btn '+(delta===1?'q-add':'q-sub'); btn.textContent = delta===1?'+1':'−1'; btn.disabled=seatEditing; btn.setAttribute('aria-label',s.name+(delta===1?' 加 1 分':' 扣 1 分')); btn.onclick = e => { if (!seatEditing) quickPoint(s.id,delta,e); }; buttons.append(btn); });
                card.append(checkbox,avatar,name,points,buttons); seat.append(card); return seat;
            }
            seatIds.forEach((id,index) => grid.append(makeSeat(students.find(s => String(s.id) === id),index)));
            const extras = students.filter(s => !seatIds.includes(String(s.id)));
            extras.forEach(s => overflow.append(makeSeat(s,null)));
            document.getElementById('overflow-label').hidden = extras.length === 0;
            document.getElementById('select-cnt').innerText = selectedStudentIds.size;
            const teachers = readLayout(TEACHERS_KEY);
            [0,1].forEach(i => { const input = document.getElementById('teacher-'+i); if (document.activeElement !== input) input.value = typeof teachers[i] === 'string' ? teachers[i] : ''; });
        }

        /* 渲染畫面 - 學生名冊 */
        function renderRoster() {
            const list = document.getElementById('roster-list');
            list.innerHTML = '';

            students.forEach((s) => {
                const item = document.createElement('div');
                item.className = 'roster-card';

                let avatarOptionsHTML = '';
                AVATAR_GROUPS.forEach(g => {
                    avatarOptionsHTML += `<optgroup label="${g.group}">`;
                    g.icons.forEach(ic => {
                        avatarOptionsHTML += `<option value="${ic}" ${s.avatar === ic ? 'selected' : ''}>${ic}</option>`;
                    });
                    avatarOptionsHTML += `</optgroup>`;
                });

                item.innerHTML = `
                    <div class="roster-info">
                        <select onchange="updateStudent(${s.id}, 'avatar', this.value)" style="font-size: 1.2rem;">
                            ${avatarOptionsHTML}
                        </select>
                        <input type="text" value="${s.name}" onchange="updateStudent(${s.id}, 'name', this.value)" placeholder="學生姓名" style="width: 140px;">
                        <label style="font-size: 0.85rem; color: var(--text-muted);">目前點數: 
                            <input type="number" value="${s.currentPoints}" onchange="updateStudent(${s.id}, 'currentPoints', Number(this.value))" style="width: 70px;">
                        </label>
                        <label style="font-size: 0.85rem; color: var(--text-muted);">總累積點數: 
                            <input type="number" value="${s.lifetimePoints}" onchange="updateStudent(${s.id}, 'lifetimePoints', Number(this.value))" style="width: 70px;">
                        </label>
                    </div>
                    <button class="btn btn-outline" style="color: var(--danger); border-color: var(--danger);" onclick="deleteStudent(${s.id})">🗑️ 刪除</button>
                `;
                list.appendChild(item);
            });
        }

        async function updateStudent(id, key, val) {
            const s = students.find(x => x.id === id);
            if (s) {
                s[key] = val;
                await saveData();
                renderStudents();
            }
        }

        async function addStudent() {
            const avatar = document.getElementById('new-avatar').value;
            const nameInput = document.getElementById('new-name');
            const name = nameInput.value.trim();
            if (!name) return alert('請輸入學生姓名！');

            const newId = students.length > 0 ? Math.max(...students.map(s => Number(s.id) || 0)) + 1 : 1;
            students.push({
                id: newId,
                name: name,
                avatar: avatar,
                currentPoints: 10,
                lifetimePoints: 10
            });
            nameInput.value = '';
            await saveData();
            renderAll();
        }

        async function deleteStudent(id) {
            if (confirm('確定要刪除這位學生嗎？')) {
                students = students.filter(s => s.id !== id);
                selectedStudentIds.delete(id);
                await saveData();
                renderAll();
            }
        }

        /* 渲染畫面 - 加扣分項目 */
        function renderBehaviors() {
            const grid = document.getElementById('behavior-grid');
            grid.innerHTML = '';

            behaviors.forEach(b => {
                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <button class="del-btn" onclick="deleteBehavior('${b.id}')">✖</button>
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">${b.icon}</div>
                    <div style="font-weight: bold; margin-bottom: 0.25rem;">${b.title}</div>
                    <div style="font-size: 0.9rem; color: ${b.type === 'pos' ? 'var(--success)' : 'var(--danger)'}; font-weight: bold;">
                        ${b.value > 0 ? '+' : ''}${b.value} 分
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function addBehaviorItem() {
            const icon = document.getElementById('new-behavior-icon').value;
            const type = document.getElementById('new-behavior-type').value;
            const title = document.getElementById('new-behavior-title').value.trim();
            let pts = Number(document.getElementById('new-behavior-pts').value);

            if (!title) return alert('請輸入項目名稱！');
            if (isNaN(pts)) pts = 1;
            if (type === 'neg' && pts > 0) pts = -pts;
            if (type === 'pos' && pts < 0) pts = Math.abs(pts);

            behaviors.push({
                id: 'b_' + Date.now(),
                title: title,
                value: pts,
                type: type,
                icon: icon
            });

            document.getElementById('new-behavior-title').value = '';
            await saveData();
            renderBehaviors();
        }

        async function deleteBehavior(id) {
            if (confirm('確定要刪除這個加扣分項目嗎？')) {
                behaviors = behaviors.filter(b => b.id !== id);
                await saveData();
                renderBehaviors();
            }
        }

        /* 渲染畫面 - 獎勵商城 */
        function renderStore() {
            const grid = document.getElementById('store-grid');
            grid.innerHTML = '';

            rewards.forEach(r => {
                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <button class="del-btn" onclick="deleteReward('${r.id}')">✖</button>
                    <div style="font-size: 2.2rem; margin-bottom: 0.25rem;">${r.icon}</div>
                    <div style="font-weight: bold; font-size: 1.05rem; margin-bottom: 0.25rem;">${r.title}</div>
                    <div style="color: var(--primary); font-weight: bold; margin-bottom: 0.75rem;">${r.cost} 點</div>
                    <button class="btn btn-primary" style="width: 100%; font-size: 0.85rem;" onclick="openRedeemModal('${r.id}')">🎁 點擊兌換</button>
                `;
                grid.appendChild(card);
            });
        }

        async function addReward() {
            const icon = document.getElementById('new-reward-icon').value;
            const title = document.getElementById('new-reward-title').value.trim();
            const cost = Number(document.getElementById('new-reward-cost').value);

            if (!title) return alert('請輸入獎勵名稱！');
            if (isNaN(cost) || cost <= 0) return alert('請輸入有效的所需點數！');

            rewards.push({
                id: 'r_' + Date.now(),
                title: title,
                cost: cost,
                icon: icon
            });

            document.getElementById('new-reward-title').value = '';
            document.getElementById('new-reward-cost').value = '';
            await saveData();
            renderStore();
        }

        async function deleteReward(id) {
            if (confirm('確定要刪除這項獎勵品項嗎？')) {
                rewards = rewards.filter(r => r.id !== id);
                await saveData();
                renderStore();
            }
        }

        function openRedeemModal(rewardId) {
            const r = rewards.find(x => x.id === rewardId);
            if (!r) return;
            currentRewardForRedeem = r;

            document.getElementById('redeem-title').innerText = `兌換：${r.icon} ${r.title} (${r.cost}點)`;
            const list = document.getElementById('redeem-list');
            list.innerHTML = '';

            students.forEach(s => {
                const canAfford = s.currentPoints >= r.cost;
                const item = document.createElement('div');
                item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 0.6rem; border-bottom: 1px solid #E2E8F0;';
                item.innerHTML = `
                    <div>
                        <span>${s.avatar} <strong>${s.name}</strong></span>
                        <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 0.5rem;">(剩餘 ${s.currentPoints} pts)</span>
                    </div>
                    <button class="btn ${canAfford ? 'btn-primary' : 'btn-outline'}" 
                            style="${!canAfford ? 'opacity: 0.5; cursor: not-allowed;' : ''}"
                            ${!canAfford ? 'disabled' : ''} 
                            onclick="redeemReward(${s.id})">
                        ${canAfford ? '兌換' : '點數不足'}
                    </button>
                `;
                list.appendChild(item);
            });

            document.getElementById('redeem-modal').classList.add('active');
        }

        async function redeemReward(studentId) {
            if (!currentRewardForRedeem) return;
            const s = students.find(x => x.id === studentId);
            if (!s) return;

            if (s.currentPoints < currentRewardForRedeem.cost) {
                return alert('點數不足！');
            }

            s.currentPoints -= currentRewardForRedeem.cost;
            addLog(s.name, `兌換獎勵：${currentRewardForRedeem.icon} ${currentRewardForRedeem.title}`, -currentRewardForRedeem.cost);
            playSound(false);
            await saveData();
            renderAll();
            closeModal('redeem-modal');
            alert(`成功幫 ${s.name} 兌換「${currentRewardForRedeem.title}」！`);
        }

        /* 渲染畫面 - 歷史紀錄 */
        function renderLogs() {
            const body = document.getElementById('logs-body');
            body.innerHTML = '';

            if (logs.length === 0) {
                body.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">尚無歷史變動紀錄</td></tr>`;
                return;
            }

            logs.forEach(l => {
                const tr = document.createElement('tr');
                const isPos = String(l.delta).startsWith('+');
                tr.innerHTML = `
                    <td style="font-size: 0.85rem; color: var(--text-muted);">${l.time}</td>
                    <td><strong>${l.student}</strong></td>
                    <td>${l.reason}</td>
                    <td style="font-weight: bold; color: ${isPos ? 'var(--success)' : 'var(--danger)'};">${l.delta}</td>
                `;
                body.appendChild(tr);
            });
        }

        function exportCSV() {
            if (logs.length === 0) return alert('目前沒有歷史紀錄可供匯出！');
            let csvContent = "\uFEFF時間,學生姓名,項目/原因,點數變動\n";
            logs.forEach(l => {
                csvContent += `"${l.time}","${l.student}","${l.reason}","${l.delta}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `點數紀錄_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /* 選擇與快速點數卡片操作 */
        function toggleSelect(id, event) {
            if (event) event.stopPropagation();
            if (selectedStudentIds.has(id)) {
                selectedStudentIds.delete(id);
            } else {
                selectedStudentIds.add(id);
            }
            renderStudents();
        }

        function toggleSelectAll() {
            if (selectedStudentIds.size === students.length) {
                selectedStudentIds.clear();
            } else {
                students.forEach(s => selectedStudentIds.add(s.id));
            }
            renderStudents();
        }

        async function quickPoint(id, delta, event) {
            if (event) event.stopPropagation();
            const s = students.find(x => x.id === id);
            if (!s) return;
            s.currentPoints += delta;
            if (delta > 0) s.lifetimePoints += delta;
            const reason = delta > 0 ? '快速加分' : '快速扣分';
            addLog(s.name, reason, delta);
            playSound(delta > 0);
            await saveData();
            renderStudents();
            const card = document.getElementById(`card-${id}`);
            showAnim(card, (delta > 0 ? '+' : '') + delta, delta > 0);
        }

        async function quickAll(delta) {
            if (students.length === 0) return;
            students.forEach(s => {
                s.currentPoints += delta;
                if (delta > 0) s.lifetimePoints += delta;
                addLog(s.name, '全班加分', delta);
            });
            playSound(delta > 0);
            await saveData();
            renderStudents();
        }

        /* 彈窗控制 (加扣分行為彈窗) */
        function openSingleModal(studentId) {
            targetStudentId = studentId;
            const s = students.find(x => x.id === studentId);
            document.getElementById('modal-title').innerText = `為 ${s ? s.name : ''} 紀錄點數`;
            populateBehaviorModal();
            document.getElementById('behavior-modal').classList.add('active');
        }

        function openBatchModal() {
            if (selectedStudentIds.size === 0) {
                return alert('請先勾選欲進行紀錄的學生！');
            }
            targetStudentId = null;
            document.getElementById('modal-title').innerText = `為選取的 ${selectedStudentIds.size} 位學生紀錄點數`;
            populateBehaviorModal();
            document.getElementById('behavior-modal').classList.add('active');
        }

        function populateBehaviorModal() {
            const posList = document.getElementById('pos-behaviors');
            const negList = document.getElementById('neg-behaviors');
            posList.innerHTML = '';
            negList.innerHTML = '';

            behaviors.filter(b => b.type === 'pos').forEach(b => {
                const div = document.createElement('div');
                div.className = 'behavior-item';
                div.innerHTML = `<span>${b.icon} ${b.title}</span><span style="color: var(--success);">+${b.value}</span>`;
                div.onclick = () => applyBehavior(b.id);
                posList.appendChild(div);
            });

            behaviors.filter(b => b.type === 'neg').forEach(b => {
                const div = document.createElement('div');
                div.className = 'behavior-item';
                div.innerHTML = `<span>${b.icon} ${b.title}</span><span style="color: var(--danger);">${b.value}</span>`;
                div.onclick = () => applyBehavior(b.id);
                negList.appendChild(div);
            });
        }

        async function applyBehavior(behaviorId) {
            const b = behaviors.find(x => x.id === behaviorId);
            if (!b) return;

            if (targetStudentId !== null) {
                const s = students.find(x => x.id === targetStudentId);
                if (s) {
                    s.currentPoints += b.value;
                    if (b.value > 0) s.lifetimePoints += b.value;
                    addLog(s.name, `${b.icon} ${b.title}`, b.value);
                    const card = document.getElementById(`card-${s.id}`);
                    showAnim(card, (b.value > 0 ? '+' : '') + b.value, b.value > 0);
                }
            } else {
                selectedStudentIds.forEach(id => {
                    const s = students.find(x => x.id === id);
                    if (s) {
                        s.currentPoints += b.value;
                        if (b.value > 0) s.lifetimePoints += b.value;
                        addLog(s.name, `${b.icon} ${b.title}`, b.value);
                        const card = document.getElementById(`card-${s.id}`);
                        showAnim(card, (b.value > 0 ? '+' : '') + b.value, b.value > 0);
                    }
                });
            }

            playSound(b.value > 0);
            await saveData();
            renderAll();
            closeModal('behavior-modal');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function renderAll() {
            renderStudents();
            renderRoster();
            renderBehaviors();
            renderStore();
            renderLogs();
        }

        /* 頁面載入初始化 */
        window.addEventListener('DOMContentLoaded', () => {
            renderAll();
            loadDataFromCloud();
        });
    </script>
</body>
</html>
